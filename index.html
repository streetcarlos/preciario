<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Importadora Cali | precios y Stock</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg" />
        <meta name="theme-color" content="#0f172a">
        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />
        
        <style>
            :root {
                --brand-red: #e11d48;
                --brand-red-dark: #be123c;
                --brand-red-soft: rgba(225, 29, 72, 0.12);
                --bg-body: #f1f5f9;
                --bg-card: #ffffff;
                --dark-slate: #0f172a;
                --dark-panel: #1e293b;
                --steel-grey: #334155;
                --text-main: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --border-light: #e2e8f0;
                --emerald: #10b981;
                --amber: #f59e0b;
                --radius-lg: 16px;
                --radius-md: 12px;
                --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
                --shadow-hover: 0 12px 28px -4px rgba(15, 23, 42, 0.12);
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background-color: var(--bg-body);
                color: var(--text-main);
                padding-bottom: 85px;
                -webkit-font-smoothing: antialiased;
            }

            /* --- HEADER INDUSTRIAL COMPACTO --- */
            header {
                background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 70%);
                padding: 28px 24px;
                border-bottom: 3px solid var(--brand-red);
                position: relative;
                overflow: hidden;
            }

            .header-inner {
                max-width: 1380px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .brand-block {
                display: flex;
                align-items: baseline;
                gap: 14px;
                flex-wrap: wrap;
            }

            header h1 {
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(2.4rem, 5vw, 3.4rem);
                letter-spacing: 3px;
                color: #ffffff;
                line-height: 1;
            }
            header h1 span { color: var(--brand-red); }

            header .subtitle {
                color: var(--text-muted);
                font-size: 0.8rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 3px;
                padding-left: 14px;
                border-left: 2px solid #334155;
            }

            .sync-pill {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.12);
                color: #e2e8f0;
                padding: 8px 14px;
                border-radius: 999px;
                font-size: 0.78rem;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                transition: 0.2s;
            }
            .sync-pill:hover {
                background: rgba(225, 29, 72, 0.2);
                border-color: var(--brand-red);
            }
            .pulse-dot {
                width: 8px; height: 8px; border-radius: 50%;
                background: var(--emerald);
                box-shadow: 0 0 8px var(--emerald);
            }

            /* --- BARRA DE BÚSQUEDA STICKY --- */
            .command-bar {
                position: sticky;
                top: 0;
                z-index: 900;
                background: rgba(241, 245, 249, 0.92);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--border-light);
                padding: 14px 20px;
                box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            }

            .command-inner {
                max-width: 1380px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .search-controls-row {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .search-input-wrap {
                flex: 1;
                background: #ffffff;
                border: 2px solid #cbd5e1;
                border-radius: 12px;
                display: flex;
                align-items: center;
                padding: 11px 18px;
                transition: all 0.2s ease;
                box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
            }
            .search-input-wrap:focus-within {
                border-color: var(--brand-red);
                box-shadow: 0 0 0 4px var(--brand-red-soft);
            }

            .search-icon {
                color: var(--text-secondary);
                font-size: 1.15rem;
                margin-right: 14px;
            }

            #searchInput {
                flex: 1;
                border: none;
                background: transparent;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 1.02rem;
                font-weight: 700;
                color: var(--text-main);
                outline: none;
                text-transform: uppercase;
            }
            #searchInput::placeholder {
                color: var(--text-muted);
                font-weight: 500;
                text-transform: none;
            }

            .kbd-hint {
                font-family: "Roboto Mono", monospace;
                font-size: 0.7rem;
                background: #f1f5f9;
                color: #64748b;
                border: 1px solid #cbd5e1;
                padding: 3px 7px;
                border-radius: 6px;
                margin-left: 8px;
            }
            @media (max-width: 768px) { .kbd-hint { display: none; } }

            .clear-btn {
                background: #f1f5f9;
                border: none;
                color: #64748b;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                cursor: pointer;
                display: none;
                align-items: center;
                justify-content: center;
                font-size: 0.85rem;
                margin-left: 8px;
                transition: 0.15s;
            }
            .clear-btn:hover { background: #fee2e2; color: var(--brand-red); }

            .radar-switch {
                background: var(--dark-slate);
                color: #ffffff;
                border: 2px solid var(--dark-slate);
                padding: 12px 18px;
                border-radius: 12px;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 0.82rem;
                font-weight: 800;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 9px;
                transition: 0.2s;
                white-space: nowrap;
            }
            .radar-switch.active {
                background: var(--brand-red);
                border-color: var(--brand-red);
                box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
            }

            .sub-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
            }

            .filter-group {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .chip-btn {
                background: #ffffff;
                border: 1px solid #cbd5e1;
                color: var(--text-secondary);
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 0.76rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                cursor: pointer;
                transition: 0.15s;
            }
            .chip-btn:hover { border-color: var(--dark-slate); color: var(--dark-slate); }
            .chip-btn.active {
                background: var(--dark-slate);
                color: #ffffff;
                border-color: var(--dark-slate);
            }

            .counter-label {
                font-size: 0.8rem;
                font-weight: 700;
                color: var(--text-secondary);
            }

            /* --- RADAR 5 TIENDAS --- */
            .radar-dock {
                max-width: 1380px;
                margin: 0 auto;
                padding: 0 20px;
                overflow: hidden;
                max-height: 0;
                opacity: 0;
                transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.25s ease;
            }
            .radar-dock.open {
                max-height: 550px;
                opacity: 1;
                margin-top: 16px;
                margin-bottom: 8px;
            }

            .radar-shell {
                background: var(--dark-slate);
                border-radius: var(--radius-lg);
                border: 1px solid #334155;
                box-shadow: 0 12px 30px -6px rgba(15, 23, 42, 0.25);
                overflow: hidden;
            }

            .radar-bar {
                background: #090e1a;
                padding: 10px 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #1e293b;
                flex-wrap: wrap;
                gap: 10px;
            }

            .radar-title {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #f8fafc;
                font-size: 0.8rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .radar-title i { color: var(--brand-red); }
            .radar-query-pill {
                background: rgba(225, 29, 72, 0.2);
                color: #fda4af;
                border: 1px solid rgba(225, 29, 72, 0.4);
                padding: 2px 9px;
                border-radius: 6px;
                font-family: "Roboto Mono", monospace;
                font-size: 0.78rem;
            }

            .radar-actions {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .radar-summary {
                font-size: 0.75rem;
                color: #94a3b8;
                font-weight: 600;
            }
            .radar-minimize-btn {
                background: #1e293b;
                color: #cbd5e1;
                border: 1px solid #334155;
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 0.72rem;
                font-weight: 700;
                cursor: pointer;
                transition: 0.15s;
            }
            .radar-minimize-btn:hover { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }

            .radar-columns {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                padding: 12px;
            }

            @media (max-width: 1150px) {
                .radar-columns {
                    display: flex;
                    overflow-x: auto;
                    scroll-snap-type: x mandatory;
                    padding-bottom: 14px;
                }
                .store-column {
                    min-width: 245px;
                    scroll-snap-align: start;
                }
            }

            .store-column {
                background: var(--dark-panel);
                border: 1px solid #334155;
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                height: 250px;
                overflow: hidden;
            }
            .store-column.has-available {
                border-color: rgba(16, 185, 129, 0.45);
            }

            .store-col-head {
                background: rgba(15, 23, 42, 0.75);
                padding: 8px 12px;
                border-bottom: 1px solid #334155;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .store-name {
                font-size: 0.76rem;
                font-weight: 800;
                color: #f1f5f9;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .store-status-dot {
                width: 7px; height: 7px; border-radius: 50%;
                background: #475569;
            }
            .store-status-dot.green {
                background: var(--emerald);
                box-shadow: 0 0 6px var(--emerald);
            }

            .store-hit-counter {
                font-family: "Roboto Mono", monospace;
                font-size: 0.68rem;
                font-weight: 700;
                padding: 2px 7px;
                border-radius: 5px;
                background: #0f172a;
                color: #94a3b8;
            }

            .store-col-list {
                padding: 7px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 5px;
                flex: 1;
            }
            .store-col-list::-webkit-scrollbar { width: 4px; }
            .store-col-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

            .store-item {
                background: rgba(15, 23, 42, 0.65);
                border: 1px solid rgba(51, 65, 85, 0.8);
                border-radius: 7px;
                padding: 6px 9px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                transition: 0.15s;
            }
            .store-item:hover {
                background: #0f172a;
                border-color: var(--brand-red);
                transform: translateX(2px);
            }

            .store-item-left {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
                flex: 1;
            }
            .store-item-code {
                font-family: "Roboto Mono", monospace;
                font-size: 0.78rem;
                font-weight: 800;
                color: #ffffff;
            }
            .store-item-desc {
                font-size: 0.69rem;
                font-weight: 600;
                color: #94a3b8;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .store-item-qty {
                font-family: "Roboto Mono", monospace;
                font-size: 0.8rem;
                font-weight: 800;
                padding: 3px 7px;
                border-radius: 6px;
                min-width: 34px;
                text-align: center;
                flex-shrink: 0;
            }
            .qty-pos {
                background: rgba(16, 185, 129, 0.18);
                color: #34d399;
                border: 1px solid rgba(16, 185, 129, 0.35);
            }
            .qty-zero {
                background: rgba(244, 63, 94, 0.12);
                color: #fb7185;
                border: 1px solid rgba(244, 63, 94, 0.25);
            }

            .store-empty-msg {
                margin: auto;
                text-align: center;
                color: #64748b;
                font-size: 0.73rem;
                font-weight: 600;
                padding: 15px 8px;
            }

            mark.hl {
                background: rgba(250, 204, 21, 0.28);
                color: #fde047;
                padding: 0 2px;
                border-radius: 3px;
            }
            .list-item mark.hl {
                background: #fef08a;
                color: #0f172a;
            }

            /* --- LISTA PRINCIPAL DE PRECIOS + ACCIONES --- */
            .catalog-section {
                max-width: 1380px;
                margin: 18px auto 0;
                padding: 0 20px;
            }

            .catalog-table-head {
                display: grid;
                grid-template-columns: 150px 1fr 130px 290px 85px;
                padding: 0 22px 10px;
                font-size: 0.74rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text-secondary);
            }
            @media (max-width: 920px) { .catalog-table-head { display: none; } }

            .product-list {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .list-item {
                display: grid;
                grid-template-columns: 150px 1fr 130px 290px 85px;
                align-items: center;
                background: var(--bg-card);
                border-radius: var(--radius-md);
                padding: 14px 22px;
                border: 1px solid var(--border-light);
                border-left: 5px solid var(--dark-slate);
                box-shadow: var(--shadow-card);
                transition: transform 0.2s ease, box-shadow 0.2s ease, border-left-color 0.2s ease;
            }
            .list-item:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-hover);
                border-left-color: var(--brand-red);
            }

            .code-cell {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding-right: 10px;
            }
            .code-badge {
                font-family: "Roboto Mono", monospace;
                font-size: 1.12rem;
                font-weight: 800;
                color: var(--text-main);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: 0.15s;
            }
            .code-badge:hover { color: var(--brand-red); }
            .code-badge i { font-size: 0.75rem; opacity: 0.45; }

            .desc-cell {
                display: flex;
                align-items: center;
                gap: 20px;
                padding-right: 16px;
                min-width: 0;
            }
            .thumb-img {
                width: 58px;
                height: 58px;
                object-fit: cover;
                border-radius: 10px;
                border: 1px solid var(--border-light);
                cursor: pointer;
                flex-shrink: 0;
                background: #f8fafc;
                transition: 0.25s ease;
            }
            .thumb-img:hover {
                transform: scale(1.15);
                border-color: var(--brand-red);
            }
            .thumb-placeholder {
                width: 58px;
                height: 58px;
                border-radius: 10px;
                background: #f8fafc;
                border: 1px dashed #cbd5e1;
                color: #94a3b8;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.15rem;
                flex-shrink: 0;
            }

            .desc-texts {
                display: flex;
                flex-direction: column;
                gap: 3px;
                min-width: 0;
            }
            .prod-name {
                font-size: 0.98rem;
                font-weight: 800;
                color: var(--text-main);
                text-transform: uppercase;
                line-height: 1.25;
            }
            .prod-equivalents {
                font-family: "Roboto Mono", monospace;
                font-size: 0.78rem;
                color: var(--text-secondary);
                font-weight: 600;
            }

            .brand-cell {
                display: flex;
                align-items: center;
            }
            .brand-tag {
                background: #f1f5f9;
                color: var(--steel-grey);
                border: 1px solid #cbd5e1;
                padding: 5px 12px;
                border-radius: 7px;
                font-size: 0.72rem;
                font-weight: 800;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .prices-side-by-side {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                align-items: stretch;
            }

            .p-card {
                padding: 9px 10px;
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .p-card.neto {
                background: var(--dark-slate);
                color: #ffffff;
            }
            .p-card.neto .p-lbl {
                font-size: 0.6rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #94a3b8;
                margin-bottom: 2px;
            }
            .p-card.neto .p-val {
                font-size: 1.12rem;
                font-weight: 800;
                letter-spacing: -0.3px;
            }

            .p-card.factura {
                background: #e2e8f0;
                border: 1px solid #cbd5e1;
                color: var(--text-main);
            }
            .p-card.factura .p-lbl {
                font-size: 0.6rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: var(--brand-red);
                margin-bottom: 2px;
            }
            .p-card.factura .p-val {
                font-size: 1.08rem;
                font-weight: 800;
                color: var(--text-main);
            }

            /* --- BOTONES DE ACCIÓN (LÁPIZ Y BASURERO) EN CADA ÍTEM --- */
            .item-actions {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 8px;
                padding-left: 10px;
            }
            .action-icon-btn {
                width: 34px;
                height: 34px;
                border-radius: 8px;
                border: 1px solid #cbd5e1;
                background: #f8fafc;
                color: var(--steel-grey);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 0.9rem;
                transition: 0.15s ease;
            }
            .action-icon-btn.edit:hover {
                background: #fef3c7;
                color: #d97706;
                border-color: #f59e0b;
                transform: scale(1.06);
            }
            .action-icon-btn.del:hover {
                background: #fee2e2;
                color: var(--brand-red);
                border-color: var(--brand-red);
                transform: scale(1.06);
            }

            /* --- RESPONSIVE MÓVIL --- */
            @media (max-width: 920px) {
                .list-item {
                    grid-template-columns: 1fr;
                    gap: 12px;
                    padding: 16px;
                }
                .mobile-top-row {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid var(--border-light);
                    padding-bottom: 8px;
                }
                .search-controls-row {
                    flex-direction: column;
                    align-items: stretch;
                }
                .radar-switch {
                    justify-content: center;
                }
            }

            /* --- TOAST DE COPIADO / AVISOS --- */
            #copyToast {
                position: fixed;
                bottom: 82px;
                right: 24px;
                background: var(--dark-slate);
                color: #fff;
                padding: 10px 18px;
                border-radius: 10px;
                font-size: 0.82rem;
                font-weight: 700;
                box-shadow: 0 10px 25px rgba(0,0,0,0.25);
                border-left: 4px solid var(--emerald);
                transform: translateY(80px);
                opacity: 0;
                transition: 0.25s ease;
                z-index: 3000;
            }
            #copyToast.show {
                transform: translateY(0);
                opacity: 1;
            }

            /* --- MODAL IMAGEN --- */
            #imageModal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.9);
                z-index: 2500;
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(8px);
            }
            #imageModal img {
                max-width: 90%;
                max-height: 82vh;
                border: 3px solid #fff;
                border-radius: 14px;
            }
            .close-btn {
                position: absolute;
                top: 24px;
                right: 34px;
                font-size: 3rem;
                color: #fff;
                cursor: pointer;
            }

            /* --- MODAL CRUD (AGREGAR / EDITAR) --- */
            .crud-fab {
                position: fixed;
                bottom: 22px;
                right: 22px;
                background: var(--brand-red);
                color: #ffffff;
                border: none;
                padding: 13px 20px;
                border-radius: 12px;
                font-family: "Plus Jakarta Sans", sans-serif;
                font-size: 0.88rem;
                font-weight: 800;
                cursor: pointer;
                z-index: 2200;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 8px 22px rgba(225, 29, 72, 0.38);
                transition: 0.2s;
            }
            .crud-fab:hover {
                background: var(--brand-red-dark);
                transform: translateY(-2px);
            }

            #modalCrud {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.82);
                backdrop-filter: blur(6px);
                z-index: 2800;
                justify-content: center;
                align-items: center;
                padding: 16px;

        <script>
            const API_WEB_URL = 'https://script.google.com/macros/s/AKfycbw5OsxI6xw-46zQ6BasPDLHItxTDi1-AF_RWR2N3rGhkyMIcqTLlymYMgC-DBXi_foM/exec';
            
            const CONFIG_TIENDAS = [
                { id: 'tienda1', nombre: 'Tienda 1' },
                { id: 'tienda2', nombre: 'Tienda 2' },
                { id: 'tienda3', nombre: 'Tienda 3' },
                { id: 'tienda4', nombre: 'Tienda 4' },
                { id: 'tienda5', nombre: 'Tienda 5' }
            ];

            const STORAGE_KEY = 'cali_inventario_v3';
            const STORAGE_TIME_KEY = 'cali_fecha_v3';

            let productos = [];
            let basesTiendas = { tienda1: [], tienda2: [], tienda3: [], tienda4: [], tienda5: [] };
            let filtroMarcaActual = "";
            let radarHabilitado = true;
            let modoCrudActual = "agregar";

            function limpiarSimbolosCodigo(val) {
                return String(val || "").toLowerCase().replace(/[\s\-_.\/(),]/g, "");
            }

            function normalizarTexto(val) {
                return String(val || "")
                    .toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[\-_.\/(),]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            function resaltarCoincidencia(textoOriginal, queryRaw) {
                const texto = String(textoOriginal || "");
                const q = queryRaw.trim();
                if (!q || q.length < 2) return texto;

                const palabras = q.split(/\s+/).filter(w => w.length >= 2).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                if (palabras.length === 0) return texto;

                try {
                    const regex = new RegExp(`(${palabras.join('|')})`, 'gi');
                    return texto.replace(regex, '<mark class="hl">$1</mark>');
                } catch (e) {
                    return texto;
                }
            }

            function coincideBusquedaInteligente(nombreYMarca, codigos, queryRaw) {
                const qTrim = queryRaw.trim();
                if (!qTrim) return true;

                const qCod = limpiarSimbolosCodigo(qTrim);
                const cCod = limpiarSimbolosCodigo(codigos);

                if (qCod.length >= 2 && cCod.includes(qCod)) return true;

                const palabrasBuscadas = normalizarTexto(qTrim).split(" ").filter(Boolean);
                const bolsaDePalabras = normalizarTexto(nombreYMarca + " " + codigos);

                return palabrasBuscadas.every(p => bolsaDePalabras.includes(p));
            }

            async function cargarDatosDesdeSheets(forzar = false) {
                const syncText = document.getElementById('syncText');
                if (syncText) syncText.innerText = "Sincronizando...";

                if (!navigator.onLine) {
                    cargarRespaldoLocal();
                    return;
                }

                const url = `${API_WEB_URL}?nocache=${Date.now()}${forzar ? '&force=1' : ''}`;

                try {
                    const res = await fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow', cache: 'no-store' });
                    if (res.ok) {
                        const data = await res.json();
                        if (data && !data.error) {
                            guardarRespaldoLocal(data);
                            procesarYMostrar(data);
                            return;
                        }
                    }
                    throw new Error("Fallback JSONP");
                } catch (err) {
                    ejecutarPlanB_JSONP(forzar);
                }
            }

            function ejecutarPlanB_JSONP(forzar = false) {
                const previo = document.getElementById('jsonp-engine');
                if (previo) previo.remove();
                const script = document.createElement('script');
                script.id = 'jsonp-engine';
                script.src = `${API_WEB_URL}?callback=recibirDatos&nocache=${Date.now()}${forzar ? '&force=1' : ''}`;
                script.onerror = () => cargarRespaldoLocal();
                document.body.appendChild(script);
            }

            function recibirDatos(data) {
                if (data && !data.error) {
                    guardarRespaldoLocal(data);
                    procesarYMostrar(data);
                }
            }

            function guardarRespaldoLocal(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    localStorage.setItem(STORAGE_TIME_KEY, hora);

                    let totalTiendas = 0;
                    if (data.tiendas) {
                        Object.values(data.tiendas).forEach(arr => { totalTiendas += (arr ? arr.length : 0); });
                    }

                    document.getElementById('syncDot').style.background = "#10b981";
                    document.getElementById('syncText').innerText = `En línea (${hora}) • ${totalTiendas} reg. tiendas`;
                } catch (e) {}
            }

            function cargarRespaldoLocal() {
                const guardado = localStorage.getItem(STORAGE_KEY);
                const hora = localStorage.getItem(STORAGE_TIME_KEY) || '';
                if (guardado) {
                    document.getElementById('syncDot').style.background = "#f59e0b";
                    document.getElementById('syncText').innerText = `Modo Offline (${hora})`;
                    procesarYMostrar(JSON.parse(guardado));
                }
            }

            function procesarYMostrar(data) {
    const listaCat = Array.isArray(data) ? data : (data.catalogo || []);
    if (data && data.tiendas) {
        basesTiendas = data.tiendas;
    }

    const codigosOcultos = ["codcali", "otroscod", "desc", "marca", "punitario", "img", "---", ""];

    productos = listaCat
        .filter(p => {
            const cod = String(p.codCali || "").trim().toLowerCase();
            const desc = String(p.desc || "").trim().toLowerCase();
            // Oculta filas que sean nombres de columna o no tengan descripción real
            if (codigosOcultos.includes(cod)) return false;
            if (desc === "desc" || desc === "sin descripción" || desc === "") return false;
            return true;
        })
        .map(p => ({
            codCali: String(p.codCali).trim(),
            otrosCod: p.otrosCod ? String(p.otrosCod).trim() : '',
            desc: String(p.desc).trim(),
            marca: p.marca ? String(p.marca).toUpperCase().trim() : 'SIN MARCA',
            pUnitario: Number(p.pUnitario) || 0,
            img: p.img ? String(p.img).trim() : ''
        }));

    filtrar();
}
            function alternarRadar() {
                radarHabilitado = !radarHabilitado;
                const btn = document.getElementById('btnRadarToggle');
                const txt = document.getElementById('radarBtnText');

                if (radarHabilitado) {
                    btn.classList.add('active');
                    txt.innerText = "ver stock: ACTIVO";
                    filtrar();
                } else {
                    btn.classList.remove('active');
                    txt.innerText = "ver stock: OCULTO";
                    document.getElementById('radarDock').classList.remove('open');
                }
            }

            function plegarRadarTemporal() {
                document.getElementById('radarDock').classList.remove('open');
            }

            function limpiarBusqueda() {
                const input = document.getElementById('searchInput');
                input.value = "";
                filtrar();
                input.focus();
            }

            function mostrarToast(prefijo, texto) {
                const toast = document.getElementById('copyToast');
                document.getElementById('toastPrefix').innerText = prefijo;
                document.getElementById('copiedCodeTxt').innerText = texto;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            }

            function copiarCodigo(codigo) {
                navigator.clipboard.writeText(codigo).catch(() => {});
                mostrarToast("Código copiado:", codigo);
            }

            function filtrarPorCodigoTienda(codigo) {
                const input = document.getElementById('searchInput');
                input.value = codigo;
                filtrar();
            }

            function actualizarRadar5Tiendas(queryRaw) {
                const dock = document.getElementById('radarDock');
                const q = queryRaw.trim();

                if (!radarHabilitado || q.length < 2) {
                    dock.classList.remove('open');
                    return;
                }

                document.getElementById('radarQueryLabel').innerText = q.toUpperCase();
                dock.classList.add('open');

                let sucursalesConStock = 0;

                const grid = document.getElementById('radarGrid5');
                grid.innerHTML = CONFIG_TIENDAS.map(t => {
                    const inv = basesTiendas[t.id] || [];
                    const hits = inv.filter(item =>
                        coincideBusquedaInteligente(item.n || "", item.c || "", q)
                    );

                    hits.sort((a, b) => (Number(b.s) || 0) - (Number(a.s) || 0));

                    const stockPositivoEnTienda = hits.some(h => (Number(h.s) || 0) > 0);
                    if (stockPositivoEnTienda) sucursalesConStock++;

                    const topHits = hits.slice(0, 20);

                    const itemsHtml = topHits.length > 0
                        ? topHits.map(item => {
                            const stk = Math.round(Number(item.s) || 0);
                            const clsQty = stk > 0 ? 'qty-pos' : 'qty-zero';
                            const codClean = String(item.c || "").replace(/'/g, "");
                            return `
                            <div class="store-item" onclick="filtrarPorCodigoTienda('${codClean}')" title="Clic para filtrar ${item.c} | ${item.n}">
                                <div class="store-item-left">
                                    <span class="store-item-code">${resaltarCoincidencia(item.c || 'S/C', q)}</span>
                                    <span class="store-item-desc">${resaltarCoincidencia(item.n || 'SIN NOMBRE', q)}</span>
                                </div>
                                <span class="store-item-qty ${clsQty}">${stk}</span>
                            </div>`;
                        }).join("")
                        : `<div class="store-empty-msg">${inv.length === 0 ? 'Sin datos sincronizados' : '0 coincidencias'}</div>`;

                    return `
                    <div class="store-column ${stockPositivoEnTienda ? 'has-available' : ''}">
                        <div class="store-col-head">
                            <span class="store-name">
                                <span class="store-status-dot ${stockPositivoEnTienda ? 'green' : ''}"></span>
                                ${t.nombre}
                            </span>
                            <span class="store-hit-counter">${hits.length} ítems</span>
                        </div>
                        <div class="store-col-list">
                            ${itemsHtml}
                        </div>
                    </div>`;
                }).join("");

                document.getElementById('radarGlobalSummary').innerText =
                    `${sucursalesConStock} de 5 tiendas con stock disponible`;
            }

            function renderCatalogo(data, queryRaw) {
                const container = document.getElementById("listaProductos");
                if (data.length === 0) {
                    container.innerHTML = `
                    <div style="padding: 60px 20px; text-align: center; background: #fff; border-radius: 14px; border: 1px solid var(--border-light); color: var(--text-secondary);">
                        <i class="fa-solid fa-box-open" style="font-size: 2.2rem; color: var(--text-muted); margin-bottom: 10px; display: block;"></i>
                        <b>No hay coincidencias en la Hoja 1 de precios.</b><br>
                        <span style="font-size: 0.85rem;">Revisa arriba el Radar de las 5 Sucursales para ver si existe con otro código en las tiendas.</span>
                    </div>`;
                    document.getElementById("productCount").innerText = "0 resultados en preciario";
                    return;
                }

                const esMovil = window.innerWidth <= 920;
                const limite = 50;
                const cortados = data.slice(0, limite);

                container.innerHTML = cortados.map(p => {
                    const unitPrice = p.pUnitario || 0;
                    const pFact = (unitPrice * 1.09).toFixed(2);
                    const tieneImg = p.img && p.img.startsWith('http');
                    const thumbHtml = tieneImg
                        ? `<img src="${p.img}" class="thumb-img" onclick="abrirImagen('${p.img}')" loading="lazy" title="Ampliar imagen">`
                        : `<div class="thumb-placeholder"><i class="fa-solid fa-cube"></i></div>`;

                    const codSafe = p.codCali.replace(/'/g, "");
                    const codAttr = encodeURIComponent(p.codCali);
                    const codHtml = resaltarCoincidencia(p.codCali, queryRaw);
                    const descHtml = resaltarCoincidencia(p.desc, queryRaw);
                    const otrosHtml = p.otrosCod ? resaltarCoincidencia(p.otrosCod, queryRaw) : "---";

                    const botonesCrudHtml = `
                        <button class="action-icon-btn edit" onclick="seleccionarParaEditarPorCodigo(decodeURIComponent('${codAttr}'))" title="Modificar este producto">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button class="action-icon-btn del" onclick="eliminarDirectoItem(decodeURIComponent('${codAttr}'))" title="Eliminar este producto">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;

                    if (esMovil) {
                        return `
                        <div class="list-item">
                            <div class="mobile-top-row">
                                <span class="code-badge" onclick="copiarCodigo('${codSafe}')">${codHtml} <i class="fa-regular fa-copy"></i></span>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="brand-tag">${p.marca}</span>
                                    ${botonesCrudHtml}
                                </div>
                            </div>
                            <div class="desc-cell">
                                ${thumbHtml}
                                <div class="desc-texts">
                                    <span class="prod-name">${descHtml}</span>
                                    <span class="prod-equivalents">Equiv: ${otrosHtml}</span>
                                </div>
                            </div>
                            <div class="prices-side-by-side">
                                <div class="p-card neto">
                                    <span class="p-lbl">Precio Normal (S/F)</span>
                                    <span class="p-val">Bs ${unitPrice.toFixed(2)}</span>
                                </div>
                                <div class="p-card factura">
                                    <span class="p-lbl">Con Factura (+9%)</span>
                                    <span class="p-val">Bs ${pFact}</span>
                                </div>
                            </div>
                        </div>`;
                    } else {
                        return `
                        <div class="list-item">
                            <div class="code-cell">
                                <span class="code-badge" onclick="copiarCodigo('${codSafe}')" title="Clic para copiar código">
                                    ${codHtml} <i class="fa-regular fa-copy"></i>
                                </span>
                            </div>
                            <div class="desc-cell">
                                ${thumbHtml}
                                <div class="desc-texts">
                                    <span class="prod-name">${descHtml}</span>
                                    <span class="prod-equivalents">${otrosHtml}</span>
                                </div>
                            </div>
                            <div class="brand-cell">
                                <span class="brand-tag">${p.marca}</span>
                            </div>
                            <div class="prices-side-by-side">
                                <div class="p-card neto">
                                    <span class="p-lbl">Normal (S/F)</span>
                                    <span class="p-val">Bs ${unitPrice.toFixed(2)}</span>
                                </div>
                                <div class="p-card factura">
                                    <span class="p-lbl">C / Factura</span>
                                    <span class="p-val">Bs ${pFact}</span>
                                </div>
                            </div>
                            <div class="item-actions">
                                ${botonesCrudHtml}
                            </div>
                        </div>`;
                    }
                }).join("");

                document.getElementById("productCount").innerText =
                    data.length > limite
                        ? `Mostrando ${cortados.length} de ${data.length} repuestos`
                        : `Mostrando ${cortados.length} repuestos`;
            }

            function filtrar() {
                const rawQ = document.getElementById("searchInput").value;
                document.getElementById("clearBtn").style.display = rawQ.length > 0 ? "inline-flex" : "none";

                actualizarRadar5Tiendas(rawQ);

                const filtrados = productos.filter(p => {
                    const okTexto = coincideBusquedaInteligente(
                        `${p.desc} ${p.marca}`,
                        `${p.codCali} ${p.otrosCod || ''}`,
                        rawQ
                    );
                    const okMarca = filtroMarcaActual === "" || p.marca === filtroMarcaActual;
                    return okTexto && okMarca;
                });

                renderCatalogo(filtrados, rawQ);
            }

            function cambiarFiltro(btn, marca) {
                document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filtroMarcaActual = marca;
                filtrar();
            }

            function abrirImagen(url) {
                if (!url || !url.startsWith('http')) return;
                document.getElementById("modalImg").src = url;
                document.getElementById("imageModal").style.display = "flex";
            }
            function cerrarImagen() {
                document.getElementById("imageModal").style.display = "none";
            }

            // =====================================================
            // FUNCIONES CRUD (AGREGAR, EDITAR POR LÁPIZ, ELIMINAR)
            // =====================================================
            function abrirModalAgregar() {
                modoCrudActual = "agregar";
                document.getElementById("tituloModalCrud").innerText = "Agregar Producto Nuevo";
                document.getElementById("btnGuardarCrud").innerText = "Guardar Producto";
                document.getElementById("crud_codCali").disabled = false;
if (!esAdminLogueado()) return;
                ["crud_codCali", "crud_otrosCod", "crud_desc", "crud_marca", "crud_pUnitario", "crud_img"].forEach(id => {
                    document.getElementById(id).value = "";
                });

                document.getElementById("crud_msg").innerText = "";
                document.getElementById("modalCrud").style.display = "flex";
            }

            function seleccionarParaEditarPorCodigo(codCali) {
                const item = productos.find(p => p.codCali === codCali);
                if (!item) return;

                modoCrudActual = "editar";
                document.getElementById("tituloModalCrud").innerText = "Editar: " + item.codCali;
                document.getElementById("btnGuardarCrud").innerText = "Guardar Cambios";

                document.getElementById("crud_codCali").value = item.codCali;
                document.getElementById("crud_codCali").disabled = true;
                document.getElementById("crud_otrosCod").value = item.otrosCod || "";
                document.getElementById("crud_desc").value = item.desc === "SIN DESCRIPCIÓN" ? "" : item.desc;
                document.getElementById("crud_marca").value = item.marca === "SIN MARCA" ? "" : item.marca;
                document.getElementById("crud_pUnitario").value = item.pUnitario || "";
                document.getElementById("crud_img").value = item.img || "";

                document.getElementById("crud_msg").innerText = "";
                document.getElementById("modalCrud").style.display = "flex";
            }

            function cerrarModalCrud() {
                document.getElementById("modalCrud").style.display = "none";
            }

            async function eliminarDirectoItem(codCali) {
                if (!confirm(`¿Seguro que deseas eliminar el producto "${codCali}" de Google Sheets?`)) return;
                mostrarToast("Eliminando:", codCali);
                await enviarPeticionCrud({ accion: "eliminar", codCali: codCali }, true);
            }

            async function guardarCambiosCrud() {
                const codCali = document.getElementById("crud_codCali").value.trim();
                const desc = document.getElementById("crud_desc").value.trim();
                const pUnitario = document.getElementById("crud_pUnitario").value.trim();
                const msg = document.getElementById("crud_msg");

                if (!codCali || !desc || pUnitario === "") {
                    msg.style.color = "#fb7185";
                    msg.innerText = "Completa codCali, desc y pUnitario.";
                    return;
                }

                const payload = {
                    accion: modoCrudActual,
                    codCali: codCali,
                    otrosCod: document.getElementById("crud_otrosCod").value.trim(),
                    desc: desc,
                    marca: document.getElementById("crud_marca").value.trim().toUpperCase(),
                    pUnitario: pUnitario,
                    img: document.getElementById("crud_img").value.trim()
                };

                await enviarPeticionCrud(payload, false);
            }

            async function enviarPeticionCrud(payload, esEliminacionDirecta) {
                const msg = document.getElementById("crud_msg");
                if (!esEliminacionDirecta) {
                    msg.style.color = "#fde047";
                    msg.innerText = "Guardando en Google Sheets...";
                }

                try {
                    const res = await fetch(API_WEB_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.ok) {
                        if (!esEliminacionDirecta) {
                            msg.style.color = "#34d399";
                            msg.innerText = "✅ " + data.mensaje;
                            setTimeout(() => cerrarModalCrud(), 600);
                        } else {
                            mostrarToast("Eliminado:", payload.codCali);
                        }
                        // Refresca el catálogo en vivo desde Google Sheets
                        cargarDatosDesdeSheets(true);
                    } else {
                        if (!esEliminacionDirecta) {
                            msg.style.color = "#fb7185";
                            msg.innerText = "❌ " + (data.mensaje || "No se pudo guardar");
                        } else {
                            alert("Error al eliminar: " + (data.mensaje || "Desconocido"));
                        }
                    }
                } catch (e) {
                    if (!esEliminacionDirecta) {
                        msg.style.color = "#fb7185";
                        msg.innerText = "❌ Error de conexión con Google Sheets.";
                    } else {
                        alert("Error de red al intentar eliminar.");
                    }
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (document.getElementById("modalCrud").style.display === "flex") {
                        cerrarModalCrud();
                    } else if (document.getElementById("imageModal").style.display === "flex") {
                        cerrarImagen();
                    } else if (document.getElementById("searchInput").value !== "") {
                        limpiarBusqueda();
                    }
                }
            });

            let prevWidth = window.innerWidth;
            window.addEventListener('resize', () => {
                if ((window.innerWidth <= 920 && prevWidth > 920) || (window.innerWidth > 920 && prevWidth <= 920)) {
                    prevWidth = window.innerWidth;
                    filtrar();
                }
            });

            window.onload = () => {
                localStorage.removeItem('respaldoInventarioCali');
                const cache = localStorage.getItem(STORAGE_KEY);
                if (cache) {
                    procesarYMostrar(JSON.parse(cache));
                }
                cargarDatosDesdeSheets(false);
            };
            const SESSION_ADMIN_KEY = "cali_admin_sesion_activa";
const SESSION_USER_KEY = "cali_admin_u";
const SESSION_PASS_KEY = "cali_admin_p";

function esAdminLogueado() {
    return sessionStorage.getItem(SESSION_ADMIN_KEY) === "1";
}

function aplicarEstadoAdmin() {
    const activo = esAdminLogueado();
    const icon = document.getElementById("adminAuthIcon");
    const txt = document.getElementById("adminAuthText");

    if (activo) {
        document.body.classList.add("admin-logged-in");
        if (icon) icon.className = "fa-solid fa-unlock";
        if (txt) txt.innerText = "Salir Admin";
    } else {
        document.body.classList.remove("admin-logged-in");
        if (icon) icon.className = "fa-solid fa-lock";
        if (txt) txt.innerText = "Admin";
    }
    filtrar();
}

function gestionarSesionAdmin() {
    if (esAdminLogueado()) {
        sessionStorage.removeItem(SESSION_ADMIN_KEY);
        sessionStorage.removeItem(SESSION_USER_KEY);
        sessionStorage.removeItem(SESSION_PASS_KEY);
        aplicarEstadoAdmin();
        mostrarToast("Sesión cerrada:", "Modo consulta");
    } else {
        document.getElementById("login_usuario").value = "";
        document.getElementById("login_pass").value = "";
        document.getElementById("login_msg").innerText = "";
        document.getElementById("modalLoginAdmin").style.display = "flex";
        setTimeout(() => document.getElementById("login_usuario").focus(), 50);
    }
}

function cerrarModalLogin() {
    document.getElementById("modalLoginAdmin").style.display = "none";
}

async function iniciarSesionAdmin() {
    const u = document.getElementById("login_usuario").value.trim();
    const p = document.getElementById("login_pass").value.trim();
    const msg = document.getElementById("login_msg");

    if (!u || !p) {
        msg.innerText = "Ingresa usuario y contraseña.";
        return;
    }

    msg.style.color = "#fde047";
    msg.innerText = "Verificando...";

    try {
        const res = await fetch(API_WEB_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ accion: "login", usuario: u, password: p })
        });
        const data = await res.json();

        if (data.ok) {
            sessionStorage.setItem(SESSION_ADMIN_KEY, "1");
            sessionStorage.setItem(SESSION_USER_KEY, u);
            sessionStorage.setItem(SESSION_PASS_KEY, p);
            cerrarModalLogin();
            aplicarEstadoAdmin();
            mostrarToast("Bienvenido:", "Modo edición activado");
        } else {
            msg.style.color = "#fb7185";
            msg.innerText = data.mensaje || "Credenciales incorrectas.";
        }
    } catch (e) {
        msg.style.color = "#fb7185";
        msg.innerText = "Error de conexión al validar.";
    }
}

async function enviarPeticionCrud(payload, esEliminacionDirecta) {
    if (!esAdminLogueado()) return;

    const msg = document.getElementById("crud_msg");
    if (!esEliminacionDirecta) {
        msg.style.color = "#fde047";
        msg.innerText = "Guardando en Google Sheets...";
    }

    const bodyConCredenciales = {
        ...payload,
        usuario: sessionStorage.getItem(SESSION_USER_KEY) || "",
        password: sessionStorage.getItem(SESSION_PASS_KEY) || ""
    };

    try {
        const res = await fetch(API_WEB_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(bodyConCredenciales)
        });
        const data = await res.json();

        if (data.ok) {
            if (!esEliminacionDirecta) {
                msg.style.color = "#34d399";
                msg.innerText = "✅ " + data.mensaje;
                setTimeout(() => cerrarModalCrud(), 600);
            } else {
                mostrarToast("Eliminado:", payload.codCali);
            }
            cargarDatosDesdeSheets(true);
        } else {
            if (!esEliminacionDirecta) {
                msg.style.color = "#fb7185";
                msg.innerText = "❌ " + (data.mensaje || "No se pudo guardar");
            } else {
                alert("Error al eliminar: " + (data.mensaje || "Desconocido"));
            }
        }
    } catch (e) {
        if (!esEliminacionDirecta) {
            msg.style.color = "#fb7185";
            msg.innerText = "❌ Error de conexión con Google Sheets.";
        } else {
            alert("Error de red al intentar eliminar.");
        }
    }
}
